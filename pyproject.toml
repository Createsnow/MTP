[project]
name = "sn-center"
version = "1.0.0"
description = "爱德泰·溯码中台 · FastAPI + MySQL 8"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pymysql>=1.1",
  "httpx>=0.27,<1",
  "structlog",
  "openpyxl>=3.1",
  "tzdata",
  "cryptography>=42",
]

[dependency-groups]
dev = [
  "import-linter>=2.17",
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migration/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# FastAPI 依赖注入写在参数默认值里
ignore = ["B008"]

# ---------------------------------------------------------------------------------------------------------------
# 模块边界检查（docs/模块化单体改造方案.md 第 6 章）：uv run lint-imports
# 代码还没搬进 app/modules/（阶段 4），契约按「文件 → 模块」的现有归属写：每个模块 = 它的服务文件 + 路由文件 +
# app/modules/<模块>/（装配声明）。ignore_imports 是阶段 0 登记的现有违规，只许减、不许增（新代码不得再加），阶段 4 清零。
# 依赖方向：dashboard → sn → order → org → 底座；log → org → 底座。只检查直接引用（allow_indirect_imports），阶段 4 后收紧。
# 底座按约定在运行时查找 app.modules 下的模块（app/platform/module.py 的 discover），不静态引用。
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
id = "platform"
name = "底座不引用业务模块"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.core", "app.db", "app.middleware", "app.models", "app.platform", "app.services.audit", "app.services.locks",
  "app.services.files", "app.services.partitions", "app.services.k3", "app.services.mes_client",
]
forbidden_modules = [
  "app.services.factories", "app.services.users", "app.api.routes.auth", "app.api.routes.users",
  "app.api.routes.factories", "app.modules.org", "app.services.orders", "app.services.changes",
  "app.services.k3_config", "app.api.routes.orders", "app.api.routes.k3_config", "app.modules.order",
  "app.services.rules", "app.services.generate", "app.services.workbench", "app.services.allocation",
  "app.services.delivery", "app.services.transfers", "app.services.query", "app.services.sn_export",
  "app.services.sn_import", "app.services.sn_sheet", "app.services.bill_stats", "app.services.dual",
  "app.services.seg", "app.services.line_void", "app.services.deletion", "app.api.routes.rules",
  "app.api.routes.generate", "app.api.routes.allocation", "app.api.routes.delivery", "app.api.routes.sn_export",
  "app.api.routes.sn_import", "app.api.routes.transfers", "app.api.routes.sn", "app.api.routes.mes",
  "app.modules.sn", "app.services.audit_query", "app.api.routes.audits", "app.modules.log", "app.services.dashboard",
  "app.api.routes.dashboard", "app.modules.dashboard", "app.modules",
]
ignore_imports = [
  # 阶段 0 登记的现有违规（2026-11-25），阶段 2 收口后删除
  "app.services.partitions -> app.services.bill_stats",  # 每日维护里的单据汇总对账 → SN 模块注册自己的每日任务
  "app.services.partitions -> app.services.delivery",  # 每日维护里的交付自检 → 同上
  "app.services.partitions -> app.services.factories",  # 每日维护里的同步生产组织 → 组织模块注册自己的每日任务
]

[[tool.importlinter.contracts]]
id = "org"
name = "组织 / 账户模块不引用工单、SN、日志、看板"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.services.factories", "app.services.users", "app.api.routes.auth", "app.api.routes.users",
  "app.api.routes.factories", "app.modules.org",
]
forbidden_modules = [
  "app.services.orders", "app.services.changes", "app.services.k3_config", "app.api.routes.orders",
  "app.api.routes.k3_config", "app.modules.order", "app.services.rules", "app.services.generate",
  "app.services.workbench", "app.services.allocation", "app.services.delivery", "app.services.transfers",
  "app.services.query", "app.services.sn_export", "app.services.sn_import", "app.services.sn_sheet",
  "app.services.bill_stats", "app.services.dual", "app.services.seg", "app.services.line_void",
  "app.services.deletion", "app.api.routes.rules", "app.api.routes.generate", "app.api.routes.allocation",
  "app.api.routes.delivery", "app.api.routes.sn_export", "app.api.routes.sn_import", "app.api.routes.transfers",
  "app.api.routes.sn", "app.api.routes.mes", "app.modules.sn", "app.services.audit_query", "app.api.routes.audits",
  "app.modules.log", "app.services.dashboard", "app.api.routes.dashboard", "app.modules.dashboard",
]
ignore_imports = [
  # 阶段 0 登记的现有违规（2026-11-25），阶段 2 收口后删除
  "app.services.factories -> app.services.bill_stats",  # 组织开关 MES 时改号状态后记单据统计 → 改为发事件 MesToggled，SN 订阅处理
]

[[tool.importlinter.contracts]]
id = "order"
name = "工单模块不引用 SN、日志、看板"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.services.orders", "app.services.changes", "app.services.k3_config", "app.api.routes.orders",
  "app.api.routes.k3_config", "app.modules.order",
]
forbidden_modules = [
  "app.services.rules", "app.services.generate", "app.services.workbench", "app.services.allocation",
  "app.services.delivery", "app.services.transfers", "app.services.query", "app.services.sn_export",
  "app.services.sn_import", "app.services.sn_sheet", "app.services.bill_stats", "app.services.dual",
  "app.services.seg", "app.services.line_void", "app.services.deletion", "app.api.routes.rules",
  "app.api.routes.generate", "app.api.routes.allocation", "app.api.routes.delivery", "app.api.routes.sn_export",
  "app.api.routes.sn_import", "app.api.routes.transfers", "app.api.routes.sn", "app.api.routes.mes",
  "app.modules.sn", "app.services.audit_query", "app.api.routes.audits", "app.modules.log", "app.services.dashboard",
  "app.api.routes.dashboard", "app.modules.dashboard",
]
ignore_imports = [
  # 阶段 0 登记的现有违规（2026-11-25），阶段 2 收口后删除
  "app.services.changes -> app.services.bill_stats",  # 订单变更后记单据统计 → 改为发事件，SN 订阅
  "app.services.changes -> app.services.delivery",  # 解除暂停后启动推送 → 改为发事件 BillSuspendChanged，SN 订阅
  "app.services.changes -> app.services.rules",  # 改 PI 时的双 SN 防呆 → SN 提供 api.is_dual 或订阅事件
  "app.services.changes -> app.services.transfers",  # 物料变更确认对应时调转移 → SN 订阅订单事件
  "app.services.orders -> app.services.line_void",  # 物料行作废校验 → 归属待定（SN 或工单），阶段 2 定
  "app.services.orders -> app.services.rules",  # 订单页显示生效规则 → 由 SN 提供组合接口
]

[[tool.importlinter.contracts]]
id = "sn"
name = "SN 模块不引用日志、看板"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.services.rules", "app.services.generate", "app.services.workbench", "app.services.allocation",
  "app.services.delivery", "app.services.transfers", "app.services.query", "app.services.sn_export",
  "app.services.sn_import", "app.services.sn_sheet", "app.services.bill_stats", "app.services.dual",
  "app.services.seg", "app.services.line_void", "app.services.deletion", "app.api.routes.rules",
  "app.api.routes.generate", "app.api.routes.allocation", "app.api.routes.delivery", "app.api.routes.sn_export",
  "app.api.routes.sn_import", "app.api.routes.transfers", "app.api.routes.sn", "app.api.routes.mes",
  "app.modules.sn",
]
forbidden_modules = [
  "app.services.audit_query", "app.api.routes.audits", "app.modules.log", "app.services.dashboard",
  "app.api.routes.dashboard", "app.modules.dashboard",
]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "log"
name = "日志模块只依赖底座与组织"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.services.audit_query", "app.api.routes.audits", "app.modules.log",
]
forbidden_modules = [
  "app.services.orders", "app.services.changes", "app.services.k3_config", "app.api.routes.orders",
  "app.api.routes.k3_config", "app.modules.order", "app.services.rules", "app.services.generate",
  "app.services.workbench", "app.services.allocation", "app.services.delivery", "app.services.transfers",
  "app.services.query", "app.services.sn_export", "app.services.sn_import", "app.services.sn_sheet",
  "app.services.bill_stats", "app.services.dual", "app.services.seg", "app.services.line_void",
  "app.services.deletion", "app.api.routes.rules", "app.api.routes.generate", "app.api.routes.allocation",
  "app.api.routes.delivery", "app.api.routes.sn_export", "app.api.routes.sn_import", "app.api.routes.transfers",
  "app.api.routes.sn", "app.api.routes.mes", "app.modules.sn", "app.services.dashboard", "app.api.routes.dashboard",
