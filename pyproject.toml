[project]
name = "sn-center"
version = "1.0.0"
description = "爱德泰·溯码中台 · FastAPI + MySQL 8"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pymysql>=1.1",
  "httpx>=0.27,<1",
  "structlog",
  "openpyxl>=3.1",
  "tzdata",
  "cryptography>=42",
]

[dependency-groups]
dev = [
  "import-linter>=2.17",
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migration/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# FastAPI 依赖注入写在参数默认值里
ignore = ["B008"]

# ---------------------------------------------------------------------------------------------------------------
# 模块边界检查（docs/模块化单体改造方案.md 第 6 章）：uv run lint-imports
# 阶段 4a 起代码已按模块分包：app/modules/<模块>/{services,routes,module.py,api.py}，底座为 app/{core,db,middleware,
# models,platform}，HTTP 公共部分在 app/api（deps.py、routes/health.py）。
# 依赖方向：dashboard → sn → order → org → 底座；log → org → 底座；pallet → box → sn（只经 api.py）。
# ignore_imports 是阶段 0 登记、阶段 4b 后剩下的违规（都涉及 MES 交付流程），只许减、不许增。只检查直接引用（allow_indirect_imports）。
# 底座按约定在运行时查找 app.modules 下的模块（app/platform/module.py 的 discover），不静态引用。
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
id = "platform"
name = "底座不引用业务模块"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.core", "app.db", "app.middleware", "app.models", "app.platform"]
forbidden_modules = ["app.modules"]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "org"
name = "组织 / 账户模块不引用工单、SN、日志、看板、箱号、托号"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.org"]
forbidden_modules = [
  "app.modules.order", "app.modules.sn", "app.modules.log", "app.modules.dashboard", "app.modules.box",
  "app.modules.pallet",
]
ignore_imports = [
  "app.modules.org.services.factories -> app.modules.sn.services.bill_stats",  # 开关 MES 改号状态后记单据统计
]

[[tool.importlinter.contracts]]
id = "order"
name = "工单模块不引用 SN、日志、看板、箱号、托号"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.order"]
forbidden_modules = [
  "app.modules.sn", "app.modules.log", "app.modules.dashboard", "app.modules.box", "app.modules.pallet",
]
ignore_imports = [
  "app.modules.order.services.changes -> app.modules.sn.services.bill_stats",  # 订单变更后记单据统计
  "app.modules.order.services.changes -> app.modules.sn.services.delivery",  # 解除暂停后启动推送
  "app.modules.order.services.changes -> app.modules.sn.services.transfers",  # 物料变更确认对应时调转移
]

[[tool.importlinter.contracts]]
id = "sn"
name = "SN 模块不引用日志、看板、箱号、托号"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.sn"]
forbidden_modules = ["app.modules.log", "app.modules.dashboard", "app.modules.box", "app.modules.pallet"]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "log"
name = "日志模块只依赖底座与组织"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.log"]
forbidden_modules = [
  "app.modules.order", "app.modules.sn", "app.modules.dashboard", "app.modules.box", "app.modules.pallet",
]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "mes-frozen"
name = "MES 接口（已联调冻结）只被 SN 交付与组织的 MES 配置引用"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "app.modules.order", "app.modules.log", "app.modules.dashboard", "app.modules.box", "app.modules.pallet",
  "app.modules.org.services.users", "app.modules.org.routes.auth", "app.modules.org.routes.users",
  "app.modules.sn.api", "app.core", "app.db", "app.middleware", "app.models", "app.platform.module",
  "app.platform.events", "app.platform.audit", "app.platform.locks", "app.platform.files", "app.platform.k3",
]
forbidden_modules = ["app.platform.mes_client", "app.modules.sn.routes.mes"]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "box-pallet"
name = "箱号、托号只通过 sn.api 读 SN，不引用其他模块的内部代码"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.box", "app.modules.pallet"]
forbidden_modules = [
  "app.modules.sn.services", "app.modules.sn.routes", "app.modules.sn.module", "app.modules.org",
  "app.modules.order", "app.modules.log", "app.modules.dashboard",
]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "pallet-box"
name = "托号只通过 box.api 使用箱号"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.pallet"]
forbidden_modules = [
  "app.modules.box.routes", "app.modules.box.services", "app.modules.box.schemas", "app.modules.box.module",
]
ignore_imports = []

[[tool.importlinter.contracts]]
id = "box-no-pallet"
name = "箱号不引用托号（依赖方向 pallet → box → sn）"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.box"]
forbidden_modules = ["app.modules.pallet"]
ignore_imports = []
